<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukasi: Uji Pengetahuanmu!</title>
    <style>
        :root {
            --red-flag: #ce1126;
            --white-flag: #ffffff;
            --text-main: #212529;
            --btn-border: #ced4da;
            --btn-hover: #f8f9fa;
            --hp-high: #2ed573;
            --hp-med: #ffa502;
            --hp-low: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            /* Latar Belakang Overlay Merah Putih */
            background: linear-gradient(135deg, rgba(206, 17, 38, 0.85) 0%, rgba(206, 17, 38, 0.7) 40%, rgba(255, 255, 255, 0.9) 60%, rgba(255, 255, 255, 1) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Kontainer Utama Bergaya Tablet/Putih Bersih */
        #app-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        /* --- Layar Login --- */
        #login-screen {
            padding: 50px 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #login-screen h1 { color: var(--red-flag); font-size: 2.5em; }
        
        input, select, button {
            padding: 15px;
            font-size: 1.1em;
            border-radius: 10px;
            border: 1px solid var(--btn-border);
            outline: none;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        button {
            background: var(--red-flag);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover { background: #a70c1d; transform: scale(1.02); }

        /* --- Layar Game --- */
        #game-screen { display: none; flex-direction: column; padding-bottom: 30px; }
        
        /* Header Sesuai Gambar (Pemain - Level - Skor) */
        #header {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            font-size: 1.1em;
            font-weight: 500;
        }

        /* Fitur HP Bar */
        #hp-container {
            width: 80%;
            background-color: #e9ecef;
            border-radius: 10px;
            height: 22px;
            margin: 15px auto 0 auto;
            overflow: hidden;
            border: 1px solid #ced4da;
            position: relative;
        }
        #hp-bar {
            height: 100%;
            width: 100%;
            background-color: var(--hp-high);
            transition: width 0.4s ease, background-color 0.4s ease;
        }
        #hp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 1px;
            font-size: 0.85em;
            font-weight: 700;
            color: #333;
        }

        /* Area Gambar Karakter */
        #character-area {
            position: relative;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        #pejabat-img {
            height: 240px;
            width: 380px; /* Rasio melebar seperti di gambar */
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            position: relative;
            z-index: 10;
        }

        /* Animasi Kesakitan */
        .pain-effect {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important;
            filter: drop-shadow(0 0 20px var(--red-flag)) saturate(1.5);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(15px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-20px, 0, 0); }
            40%, 60% { transform: translate3d(20px, 0, 0); }
        }

        /* Area Timer dan Pertanyaan */
        #timer-container { font-size: 1.1em; font-weight: 500; color: #555; margin-bottom: 5px;}
        #question-text { font-size: 1.4em; margin: 10px 20px 25px 20px; font-weight: 600; color: #000; }
        
        /* Opsi Jawaban (2x2 Grid, Putih Bersih) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .option-btn {
            background: #ffffff;
            color: #000;
            padding: 15px 20px;
            font-size: 1.1em;
            border-radius: 12px;
            border: 1px solid var(--btn-border);
            cursor: pointer;
            font-weight: 500;
            text-align: left; /* Teks rata kiri */
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }
        .option-btn:hover { background: var(--btn-hover); border-color: #adb5bd; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }

        .projectile {
            position: absolute;
            font-size: 90px; 
            z-index: 20;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
        }

        /* Responsif HP */
        @media (max-width: 600px) {
            #header { padding: 15px; font-size: 0.95em; }
            .options-grid { grid-template-columns: 1fr; padding: 0 20px; gap: 10px; }
            #pejabat-img { height: 180px; width: 280px; }
            #question-text { font-size: 1.2em; }
            .projectile { font-size: 60px; }
        }
    </style>
</head>
<body>

                { q: "Rumus kimia air murni?", options: ["CO2", "H2O", "NaCl", "O2"], answer: 1 },

                { q: "Peristiwa meleburnya sel sperma dan ovum?", options: ["Polinasi", "Fertilisasi", "Ovulasi", "Menstruasi"], answer: 1 },
                { q: "Letak astronomis Indonesia berada pada?", options: ["6° LU - 11° LS", "6° LS - 11° LU", "10° LU - 15° LS", "0° - 10° LS"], answer: 0 },

        const throwItems = [
            { emoji: '🥚', type: 'egg' },
            { emoji: '🍌', type: 'banana' },
            { emoji: '💣', type: 'bomb' },
            { emoji: '🔪', type: 'knife' }
        ];

        // Nama file gambar
        const baseImageNormal = 'pejabat-normal.jpg';
        const imageHurt = 'pejabat-sakit.jpg';
        const imageBonyok = 'pejabat-bonyok.jpg'; // Gambar saat darah <= 20%
        
        let currentImageNormal = baseImageNormal; 
        
        const audioSalah = new Audio("reaksi-salah.mp3");

        let currentQuestions = [], currentQIndex = 0;
        let playerName = "", currentDifficultyText = "";
        let score = 0;
        let timeLeft = 15, timerInterval;
        
        // Fitur HP
        let maxQuestions = 25;
        let hp = 100;
        let damagePerCorrect = 100 / maxQuestions; 

        // --- SISTEM AUDIO SINTESIS ---
        let audioCtx, noiseBuffer;
        function initAudio() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, slideFreq = null) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playNoise(filterType, freq, duration, gainVolume = 1) {
            if (!noiseBuffer || !audioCtx) return;
            const source = audioCtx.createBufferSource();
            source.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = filterType; filter.frequency.value = freq;
            const gain = audioCtx.createGain();
            source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(gainVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            source.start(); source.stop(audioCtx.currentTime + duration);
        }

        function playSfx(type) {
            if (!audioCtx) return;
            switch(type) {
                case 'throw':   playTone(600, 'sine', 0.3, 100); break;
                case 'egg':     playNoise('highpass', 1500, 0.3, 1.5); break;
                case 'banana':  playTone(800, 'sine', 0.5, 100); break;
                case 'bomb':    playNoise('lowpass', 200, 1.2, 2.0); break;
                case 'knife':   playTone(1500, 'sawtooth', 0.1, 100); break;
            }
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value;
            if (!nameInput) { alert("Silakan masukkan nama Anda terlebih dahulu!"); return; }
            
            initAudio(); 

            playerName = nameInput;
            const difficultySelect = document.getElementById('difficulty');
            const difficulty = difficultySelect.value;
            currentDifficultyText = difficultySelect.options[difficultySelect.selectedIndex].text.split(' ')[1]; // Ambil teks level (Mudah/Sedang/Sulit)

            currentQuestions = [...questionsData[difficulty]];
            currentQuestions.sort(() => Math.random() - 0.5); 
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            document.getElementById('display-name').innerText = `Pemain: ${playerName}`;
            document.getElementById('display-level').innerText = `Level: ${currentDifficultyText}`;
            score = 0;
            hp = 100; 
            currentQIndex = 0;
            currentImageNormal = baseImageNormal;
            document.getElementById('pejabat-img').src = currentImageNormal;
            
            updateScore();
            updateHP();
            loadQuestion();
        }

        function updateScore() {
            document.getElementById('display-score').innerText = `Skor: ${score}`;
        }

        function updateHP() {
            const hpBar = document.getElementById('hp-bar');
            const hpText = document.getElementById('hp-text');
            
            if(hp < 0) hp = 0;
            
            hpBar.style.width = hp + '%';
            hpText.innerText = `HP Pejabat: ${Math.round(hp)}% | Soal: ${currentQIndex + 1}/${maxQuestions}`;

            // Ubah wajah jadi bonyok
            if (hp <= 20) {
                hpBar.style.backgroundColor = "var(--hp-low)";
                currentImageNormal = imageBonyok; 
            } else if (hp <= 50) {
                hpBar.style.backgroundColor = "var(--hp-med)";
            } else {
                hpBar.style.backgroundColor = "var(--hp-high)";
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('time-left').style.color = "var(--text-main)";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 5) document.getElementById('time-left').style.color = "var(--red-flag)"; 
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function triggerMp3Salah() {
            audioSalah.currentTime = 0;
            audioSalah.play().catch(e => console.log("Gagal memutar MP3:", e));
        }

        function handleTimeOut() {
            triggerMp3Salah(); 
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            const correctIndex = currentQuestions[currentQIndex].answer;
            buttons[correctIndex].style.background = '#2ed573';
            buttons[correctIndex].style.color = 'white';
            buttons[correctIndex].style.borderColor = '#2ed573';

            setTimeout(() => { currentQIndex++; loadQuestion(); }, 1500);
        }

        function loadQuestion() {
            if (currentQIndex >= maxQuestions || hp <= 0) { 
                clearInterval(timerInterval);
                setTimeout(() => {
                    if(hp <= 0) {
                        alert(`SELAMAT! ${playerName}, Anda berhasil mengalahkan pejabat!\nSkor Akhir: ${score}`);
                    } else {
                        alert(`GAME SELESAI!\nSkor Akhir: ${score}\nSisa Darah Pejabat: ${Math.round(hp)}%`);
                    }
                    location.reload(); 
                }, 500);
                return;
            }

            document.getElementById('pejabat-img').src = currentImageNormal;
            updateHP();

            const qData = currentQuestions[currentQIndex];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Generate A, B, C, D
            const prefixes = ['A', 'B', 'C', 'D'];
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${prefixes[index]}. ${opt}`;
                btn.onclick = () => checkAnswer(index, qData.answer, btn);
                optionsContainer.appendChild(btn);
            });

            startTimer(); 
        }

        function checkAnswer(selectedIndex, correctIndex, clickedBtn) {
            clearInterval(timerInterval); 
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                // Jawaban Benar
                hp -= damagePerCorrect;
                score += 10;
                updateScore();
                updateHP();

                clickedBtn.style.background = '#2ed573';
                clickedBtn.style.color = 'white';
                clickedBtn.style.borderColor = '#2ed573';
                triggerCorrectAction();
            } else {
                // Jawaban Salah
                triggerMp3Salah(); 
                clickedBtn.style.background = '#ff4757';
                clickedBtn.style.color = 'white';
                clickedBtn.style.borderColor = '#ff4757';
                
                buttons[correctIndex].style.background = '#2ed573'; 
                buttons[correctIndex].style.color = 'white';
                buttons[correctIndex].style.borderColor = '#2ed573';
                
                setTimeout(() => { currentQIndex++; loadQuestion(); }, 1500);
            }
        }

        function triggerCorrectAction() {
            playSfx('throw'); 
            const charArea = document.getElementById('character-area');
            const imgPejabat = document.getElementById('pejabat-img');
            const selectedItemObj = throwItems[Math.floor(Math.random() * throwItems.length)];
            
            const projectile = document.createElement('div');
            projectile.className = 'projectile';
            projectile.innerText = selectedItemObj.emoji;
            projectile.style.left = '50%';
            projectile.style.bottom = '-80px';
            projectile.style.transform = 'translateX(-50%) rotate(0deg)';
            
            charArea.appendChild(projectile);

            setTimeout(() => {
                projectile.style.bottom = '50%'; 
                projectile.style.transform = 'translateX(-50%) rotate(720deg)';
            }, 50);

            // Saat mengenai wajah
            setTimeout(() => {
                projectile.remove();
                playSfx(selectedItemObj.type); 
                
                imgPejabat.src = imageHurt; 
                imgPejabat.classList.add('pain-effect');
                
                setTimeout(() => {
                    imgPejabat.classList.remove('pain-effect');
                    currentQIndex++;
                    loadQuestion(); 
                }, 1300);

            }, 450); 
        }
    </script>
</body>
</html>
