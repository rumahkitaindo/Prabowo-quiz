<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Edukasi: Uji Pengetahuanmu!</title>
    <style>
        :root {
            --red-flag: #ce1126;
            --white-flag: #ffffff;
            --text-main: #212529;
            --btn-border: #ced4da;
            --btn-hover: #f8f9fa;
            --hp-high: #2ed573;
            --hp-med: #ffa502;
            --hp-low: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(206, 17, 38, 0.85) 0%, rgba(206, 17, 38, 0.7) 40%, rgba(255, 255, 255, 0.9) 60%, rgba(255, 255, 255, 1) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        /* --- Layar Login --- */
        #login-screen { padding: 50px 30px; display: flex; flex-direction: column; gap: 20px; }
        #login-screen h1 { color: var(--red-flag); font-size: 2.5em; }
        input, select, .start-btn {
            padding: 15px; font-size: 1.1em; border-radius: 10px; border: 1px solid var(--btn-border);
            outline: none; width: 100%; max-width: 400px; margin: 0 auto;
        }
        .start-btn { background: var(--red-flag); color: white; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
        .start-btn:hover { background: #a70c1d; transform: scale(1.02); }

        /* --- Layar Game --- */
        #game-screen { display: none; flex-direction: column; padding-bottom: 30px; }
        
        #header {
            display: flex; justify-content: space-between; padding: 20px 30px; background: #f8f9fa;
            border-bottom: 2px solid #e9ecef; font-size: 1.1em; font-weight: 500;
        }

        #hp-container {
            width: 80%; background-color: #e9ecef; border-radius: 10px; height: 22px;
            margin: 15px auto 0 auto; overflow: hidden; border: 1px solid #ced4da; position: relative;
        }
        #hp-bar { height: 100%; width: 100%; background-color: var(--hp-high); transition: width 0.4s ease, background-color 0.4s ease; }
        #hp-text { position: absolute; width: 100%; text-align: center; top: 1px; font-size: 0.85em; font-weight: 700; color: #333; }

        #character-area { position: relative; height: 260px; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        
        #pejabat-img {
            height: 240px; width: 380px; border-radius: 12px; border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); object-fit: cover; position: relative; z-index: 10;
        }
        
        .pain-effect { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important; filter: drop-shadow(0 0 20px var(--red-flag)) saturate(1.5); }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(15px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-20px, 0, 0); }
            40%, 60% { transform: translate3d(20px, 0, 0); }
        }

        #timer-container { font-size: 1.1em; font-weight: 500; color: #555; margin-bottom: 5px;}
        #question-text { font-size: 1.4em; margin: 10px 20px 25px 20px; font-weight: 600; color: #000; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 40px; max-width: 800px; margin: 0 auto; }
        
        .option-btn {
            background: #ffffff; color: #000; padding: 15px 20px; font-size: 1.1em; border-radius: 12px;
            border: 1px solid var(--btn-border); cursor: pointer; font-weight: 500; text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: all 0.2s ease;
        }
        .option-btn:hover { background: var(--btn-hover); border-color: #adb5bd; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }

        .projectile {
            position: absolute; font-size: 90px; z-index: 20; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.1, 0.8, 0.2, 1); filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
        }

        /* --- OVERLAYS (Finish Him & Fatality) --- */
        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }

        /* Modal Finish Him */
        .modal-box {
            background: #111; padding: 40px; border-radius: 15px; text-align: center;
            border: 4px solid var(--red-flag); box-shadow: 0 0 30px rgba(206,17,38,0.5);
        }
        .modal-box h2 {
            color: var(--red-flag); font-size: 4em; margin-bottom: 30px; font-weight: 900;
            text-shadow: 2px 2px 5px #000; text-transform: uppercase; font-style: italic;
        }
        .modal-btn-group { display: flex; gap: 20px; justify-content: center; }
        .modal-btn-group button {
            padding: 15px 40px; font-size: 1.5em; border-radius: 8px; cursor: pointer;
            font-weight: bold; border: none; transition: transform 0.2s;
        }
        .btn-ya { background: var(--hp-high); color: white; }
        .btn-tidak { background: #555; color: white; }
        .modal-btn-group button:hover { transform: scale(1.1); }

        /* Layar Fatality / Video */
        #fatality-container { background: #000; }
        #fatality-video { width: 100%; height: 100%; object-fit: cover; transition: opacity 1s; }
        
        /* Animasi Teks Akhir */
        .cinematic-text {
            position: absolute; font-size: 5em; font-weight: 900;
            text-shadow: 0px 5px 20px rgba(0,0,0,1); text-align: center;
            opacity: 0; transform: scale(0.5); pointer-events: none;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #eliminated-text { color: var(--red-flag); letter-spacing: 5px; text-transform: uppercase; }
        #victory-text { color: #ffd700; font-size: 4em; }

        .show-text { opacity: 1 !important; transform: scale(1) !important; }

        @media (max-width: 600px) {
            #header { padding: 15px; font-size: 0.95em; }
            .options-grid { grid-template-columns: 1fr; padding: 0 20px; gap: 10px; }
            #pejabat-img { height: 180px; width: 280px; }
            #question-text { font-size: 1.2em; }
            .projectile { font-size: 60px; }
            .modal-box h2 { font-size: 2.5em; }
            .cinematic-text { font-size: 3em !important; }
        }
    </style>
</head>

        // --- ASSET AUDIO ---
        const audioSalah = new Audio("reaksi-salah.mp3");
        const audioFinishHim = new Audio("finish-him.mp3"); 

        let currentImageNormal = baseImageNormal; 
        let currentQuestions = [], currentQIndex = 0, score = 0, hp = 100, playerName = "";
        let timeLeft = 15, timerInterval;
        
        const maxQuestions = 25;
        const damagePerCorrect = 5; 

        // Sistem Audio SFX
        let audioCtx, noiseBuffer;
        function initAudio() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, slideFreq = null) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playNoise(filterType, freq, duration, gainVolume = 1) {
            if (!noiseBuffer || !audioCtx) return;
            const source = audioCtx.createBufferSource(); source.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = filterType; filter.frequency.value = freq;
            const gain = audioCtx.createGain(); source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(gainVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            source.start(); source.stop(audioCtx.currentTime + duration);
        }

        function playSfx(type) {
            if (!audioCtx) return;
            switch(type) {
                case 'throw': playTone(600, 'sine', 0.3, 100); break;
                case 'egg': playNoise('highpass', 1500, 0.3, 1.5); break;
                case 'banana': playTone(800, 'sine', 0.5, 100); break;
                case 'bomb': playNoise('lowpass', 200, 1.2, 2.0); break;
                case 'knife': playTone(1500, 'sawtooth', 0.1, 100); break;
            }
        }

            playerName = nameInput;
            const difficultySelect = document.getElementById('difficulty');
            const diffText = difficultySelect.options[difficultySelect.selectedIndex].text.split(' ')[1]; 
            
            currentQuestions = [...questionsData[difficultySelect.value]].sort(() => Math.random() - 0.5);

            document.getElementById('game-screen').style.display = 'flex';
            
            document.getElementById('display-name').innerText = `Pemain: ${playerName}`;
            document.getElementById('display-level').innerText = `Level: ${diffText}`;
            
            score = 0; hp = 100; currentQIndex = 0; currentImageNormal = baseImageNormal;
            document.getElementById('pejabat-img').src = currentImageNormal;
            
            updateScore(); updateHP(); loadQuestion();
        }

        function updateScore() { document.getElementById('display-score').innerText = `Skor: ${score}`; }

        function updateHP() {
            if(hp < 0) hp = 0; 
            const hpBar = document.getElementById('hp-bar');
            hpBar.style.width = hp + '%';
            
            document.getElementById('hp-text').innerText = `HP Pejabat: ${Math.round(hp)}% | Soal: ${Math.min(currentQIndex + 1, maxQuestions)}/${maxQuestions}`;

            if (hp <= 20) { hpBar.style.backgroundColor = "var(--hp-low)"; currentImageNormal = imageBonyok; } 
            else if (hp <= 50) { hpBar.style.backgroundColor = "var(--hp-med)"; } 
            else { hpBar.style.backgroundColor = "var(--hp-high)"; }
        }

        function startTimer() {
            clearInterval(timerInterval); timeLeft = 15;
            document.getElementById('time-left').innerText = timeLeft;
            document.getElementById('time-left').style.color = "var(--text-main)";
            timerInterval = setInterval(() => {
                timeLeft--; document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 5) document.getElementById('time-left').style.color = "var(--red-flag)"; 
                if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeOut(); }
            }, 1000);
        }

        function handleTimeOut() {
            audioSalah.currentTime = 0; audioSalah.play().catch(e=>{});
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            const correctIndex = currentQuestions[currentQIndex].answer;
            buttons[correctIndex].style.background = '#2ed573'; buttons[correctIndex].style.color = 'white'; buttons[correctIndex].style.borderColor = '#2ed573';
            setTimeout(() => { currentQIndex++; loadQuestion(); }, 1500);
        }

        function loadQuestion() {
            // Cek Menang / Bos Mati
            if (Math.round(hp) <= 0) {
                clearInterval(timerInterval);
                document.getElementById('finish-him-modal').style.display = 'flex';
                
                // MEMAINKAN AUDIO FINISH HIM (Aman karena sudah di-unlock di awal)
                audioFinishHim.currentTime = 0;
                audioFinishHim.play().catch(e => console.log("Masih diblokir browser:", e));
                
                return;
            } 
            
            // Cek Soal Habis
            if (currentQIndex >= maxQuestions) { 
                clearInterval(timerInterval);
                setTimeout(() => { 
                    alert(`YAHH! SOAL HABIS!\nSkor Akhir: ${score}\nPejabat gagal dikalahkan. Sisa Darah: ${Math.round(hp)}%`); 
                    location.reload(); 
                }, 500);
                return;
            }

            document.getElementById('pejabat-img').src = currentImageNormal;
            updateHP();

            const qData = currentQuestions[currentQIndex];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            const prefixes = ['A', 'B', 'C', 'D'];
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${prefixes[index]}. ${opt}`;
                btn.onclick = () => checkAnswer(index, qData.answer, btn);
                optionsContainer.appendChild(btn);
            });
            startTimer(); 
        }

        function checkAnswer(selectedIndex, correctIndex, clickedBtn) {
            clearInterval(timerInterval); 
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                hp -= damagePerCorrect; score += 10;
                updateScore(); updateHP();
                clickedBtn.style.background = '#2ed573'; clickedBtn.style.color = 'white'; clickedBtn.style.borderColor = '#2ed573';
                triggerCorrectAction();
            } else {
                audioSalah.currentTime = 0; audioSalah.play().catch(e=>{});
                clickedBtn.style.background = '#ff4757'; clickedBtn.style.color = 'white'; clickedBtn.style.borderColor = '#ff4757';
                buttons[correctIndex].style.background = '#2ed573'; buttons[correctIndex].style.color = 'white'; buttons[correctIndex].style.borderColor = '#2ed573';
                setTimeout(() => { currentQIndex++; loadQuestion(); }, 1500);
            }
        }

        function triggerCorrectAction() {
            playSfx('throw'); 
            const charArea = document.getElementById('character-area');
            const imgPejabat = document.getElementById('pejabat-img');
            const selectedItemObj = throwItems[Math.floor(Math.random() * throwItems.length)];
            
            const projectile = document.createElement('div');
            projectile.className = 'projectile'; projectile.innerText = selectedItemObj.emoji;
            projectile.style.left = '50%'; projectile.style.bottom = '-80px'; projectile.style.transform = 'translateX(-50%) rotate(0deg)';
            charArea.appendChild(projectile);

            setTimeout(() => { projectile.style.bottom = '50%'; projectile.style.transform = 'translateX(-50%) rotate(720deg)'; }, 50);

            setTimeout(() => {
                projectile.remove(); playSfx(selectedItemObj.type); 
                imgPejabat.src = imageHurt; imgPejabat.classList.add('pain-effect');
                
                setTimeout(() => {
                    imgPejabat.classList.remove('pain-effect');
                    currentQIndex++; loadQuestion(); 
                }, 1300);
            }, 450); 
        }

        // --- SISTEM FATALITY ---
        function normalWin() {
            audioFinishHim.pause();
            document.getElementById('finish-him-modal').style.display = 'none';
            alert(`SELAMAT! ${playerName}, Anda melepaskan pejabat dengan skor ${score}!`);
            location.reload();
        }

        function executeFatality() {
            audioFinishHim.pause();
            document.getElementById('finish-him-modal').style.display = 'none';
            const fatContainer = document.getElementById('fatality-container');
            const fatVideo = document.getElementById('fatality-video');
            fatContainer.style.display = 'flex';
            
            let playPromise = fatVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Video gagal putar:", error);
                    triggerCinematicEnding();
                });
            }
            fatVideo.onended = () => { triggerCinematicEnding(); };
        }

        function triggerCinematicEnding() {
            document.getElementById('fatality-video').style.opacity = '0.2'; 
            const elimText = document.getElementById('eliminated-text');
            const vicText = document.getElementById('victory-text');
            
            elimText.classList.add('show-text');

            setTimeout(() => {
                elimText.classList.remove('show-text');
                setTimeout(() => {
                    document.getElementById('vic-name').innerText = playerName;
                    vicText.classList.add('show-text');
                    setTimeout(() => { location.reload(); }, 4000);
                }, 1000); 
            }, 3000);
        }
    </script>
</body>
</html>
